const AMP = window.AMP || [];
const HB = '#1e5bd8', HB2 = '#1747ad', NV = '#101c3f', DEN = '#1f3c78', DEN2 = '#2b4f98', STITCH = '#86a3d6';
const INK = '#1b1b1b', BLUE = '#3d8bd4', RED = '#e0443b', GREEN = '#3fae49';

// ---------- helpers ----------
const txt = (x, y, s, size = 46, o = {}) =>
  `<text x="${x}" y="${y}" font-size="${size}" font-weight="${o.w || 700}" fill="${o.fill || INK}" text-anchor="${o.anchor || 'middle'}" ${o.extra || ''}>${s}</text>`;
const A = (tin, anim, body, o = {}) =>
  `<g class="an" data-in="${tin}" data-a="${anim}" ${o.sfx ? `data-sfx="${o.sfx}"` : ''} ${o.dur ? `data-dur="${o.dur}"` : ''} ${o.out ? `data-out="${o.out}"` : ''} ${o.attr || ''}><g transform="translate(${o.x || 0},${o.y || 0}) scale(${o.s || 1})">${body}</g></g>`;
const line = (x1, y1, x2, y2, c = INK, w = 5) => `<path d="M${x1},${y1} L${x2},${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" fill="none" pathLength="1"/>`;
const bigX = (r = 60) => `<circle r="${r * 1.25}" fill="#fff" stroke="${RED}" stroke-width="7" pathLength="1"/>${line(-r * .6, -r * .6, r * .6, r * .6, RED, 14)}${line(r * .6, -r * .6, -r * .6, r * .6, RED, 14)}`;
const check = (r = 50, c = GREEN) => `<path d="M${-r},0 L${-r * .3},${r * .7} L${r},${-r * .8}" stroke="${c}" stroke-width="${r * .28}" stroke-linecap="round" stroke-linejoin="round" fill="none" pathLength="1"/>`;
const bill = (w = 120, h = 62) => `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="6" fill="#8fd18a" stroke="#2c6b2a" stroke-width="4"/><rect x="${-w / 2 + 8}" y="${-h / 2 + 8}" width="${w - 16}" height="${h - 16}" rx="4" fill="none" stroke="#2c6b2a" stroke-width="2"/><circle r="${h * .28}" fill="#c9eec5" stroke="#2c6b2a" stroke-width="2.5"/>${txt(0, h * .15, '$', h * .42, { fill: '#2c6b2a' })}`;
const coin = () => `<ellipse rx="34" ry="12" fill="#f2c94c" stroke="#8a6a10" stroke-width="3.5"/>`;
const coins = (n = 4) => Array.from({ length: n }, (_, i) => `<g transform="translate(0,${-i * 13})">${coin()}</g>`).join('');
const arrowR = (len = 120, c = INK, w = 5) => `<path d="M0,0 L${len},0 M${len - 18},-14 L${len},0 L${len - 18},14" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>`;
const arrowUp = (len = 90, c = GREEN) => `<path d="M0,0 L0,${-len} M-20,${-len + 22} L0,${-len} L20,${-len + 22}" stroke="${c}" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>`;
const warn = (s = 1) => `<g transform="scale(${s})"><path d="M0,-62 L66,52 L-66,52 Z" fill="${RED}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><rect x="-7" y="-28" width="14" height="48" rx="6" fill="#fff"/><circle cy="36" r="8" fill="#fff"/></g>`;
const card = (label, icon, w = 150, h = 120, fill = '#fff') => `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="14" fill="${fill}" stroke="${INK}" stroke-width="4.5"/><g transform="translate(0,${-h * .12})">${icon}</g>${txt(0, h / 2 - 14, label, 32)}`;
const iconCash = `<g transform="scale(.55)">${bill()}</g>`;
const iconGIC = `<rect x="-24" y="-30" width="48" height="56" rx="4" fill="#fff6dc" stroke="${INK}" stroke-width="3.5"/><path d="M-14,-16 H14 M-14,-6 H14 M-14,4 H6" stroke="${INK}" stroke-width="3"/><circle cx="12" cy="16" r="8" fill="${RED}" stroke="${INK}" stroke-width="2"/>`;
const iconStock = `<path d="M-34,24 L-34,-28 M-34,24 L36,24" stroke="${INK}" stroke-width="3.5" fill="none"/><path d="M-28,14 L-10,-2 L4,8 L30,-22" stroke="${GREEN}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M18,-22 L30,-22 L30,-10" stroke="${GREEN}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
const iconETF = `<circle r="28" fill="${BLUE}" stroke="${INK}" stroke-width="3.5"/><path d="M0,0 L0,-28 A28,28 0 0 1 26,10 Z" fill="#f2c94c" stroke="${INK}" stroke-width="3"/><path d="M0,0 L26,10 A28,28 0 0 1 -12,25 Z" fill="${GREEN}" stroke="${INK}" stroke-width="3"/>`;
// cardboard box, origin = bottom center
const box = (label = 'TFSA', w = 300, h = 190, stuffed = '') => {
  const d = 46;
  return `<path d="M${-w / 2},${-h} L${-w / 2 + d},${-h - d} L${w / 2 + d},${-h - d} L${w / 2},${-h} Z" fill="#b98b52" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
  ${stuffed}
  <path d="M${w / 2},${-h} L${w / 2 + d},${-h - d} L${w / 2 + d},${-d} L${w / 2},0 Z" fill="#c99a5e" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
  <rect x="${-w / 2}" y="${-h}" width="${w}" height="${h}" fill="#e2b97e" stroke="${INK}" stroke-width="5"/>
  <path d="M${-w / 2},${-h} L${-w / 2 - 40},${-h - 60} L${w / 2 - 70},${-h - 60} L${w / 2 - 30},${-h}" fill="#e9c58f" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
  <path d="M${w / 2 + d},${-h - d} L${w / 2 + d + 40},${-h - d - 40} L${w / 2 + 20},${-h + 10} L${w / 2},${-h}" fill="#d9ab6c" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
  <rect x="${-w / 2 + 40}" y="${-h + 50}" width="${w - 80}" height="86" rx="10" fill="#fff" stroke="${INK}" stroke-width="4"/>
  ${txt(0, -h + 112, label, 60)}
  <ellipse cx="20" cy="10" rx="${w * .7}" ry="14" fill="#000" opacity=".07"/>`;
};
const calendar = (top, big, sub = '', w = 170) => `<rect x="${-w / 2}" y="-90" width="${w}" height="180" rx="12" fill="#fff" stroke="${INK}" stroke-width="5"/><path d="M${-w / 2},-48 V-78 Q${-w / 2},-90 ${-w / 2 + 12},-90 H${w / 2 - 12} Q${w / 2},-90 ${w / 2},-78 V-48 Z" fill="${RED}" stroke="${INK}" stroke-width="5"/>${txt(0, -58, top, 30, { fill: '#fff' })}<circle cx="-40" cy="-92" r="8" fill="#fff" stroke="${INK}" stroke-width="4"/><circle cx="40" cy="-92" r="8" fill="#fff" stroke="${INK}" stroke-width="4"/>${txt(0, 30, big, 66)}${txt(0, 72, sub, 28, { w: 400 })}`;
const laptop = (l1, l2) => `<rect x="-140" y="-170" width="280" height="180" rx="12" fill="#f3f7fb" stroke="${INK}" stroke-width="5"/><rect x="-140" y="-170" width="280" height="38" rx="12" fill="#2a5e8e"/>${txt(0, -142, l1, 26, { fill: '#fff' })}${txt(0, -70, l2, 34)}<rect x="-80" y="-48" width="160" height="30" rx="8" fill="${GREEN}" stroke="${INK}" stroke-width="3"/>${txt(0, -26, 'CHECK', 22, { fill: '#fff' })}<path d="M-170,10 L170,10 L190,34 L-190,34 Z" fill="#d6dde4" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>`;
const suitcase = () => `<rect x="-26" y="-118" width="52" height="30" rx="10" fill="none" stroke="${INK}" stroke-width="7"/><rect x="-70" y="-96" width="140" height="96" rx="12" fill="#c0703a" stroke="${INK}" stroke-width="5"/><path d="M-36,-96 V0 M36,-96 V0" stroke="${INK}" stroke-width="4"/><rect x="-30" y="-62" width="60" height="22" rx="4" fill="#fff" stroke="${INK}" stroke-width="3"/>`;
const leaf = (s = 1, c = RED) => `<path transform="scale(${s}) translate(-50,-50)" d="M50,5 L58,22 L68,18 L64,42 L80,28 L84,36 L96,34 L90,50 L96,54 L76,70 L80,78 L54,74 L55,95 L45,95 L46,74 L20,78 L24,70 L4,54 L10,50 L4,34 L16,36 L20,28 L36,42 L32,18 L42,22 Z" fill="${c}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
const flag = () => `<rect x="-120" y="-66" width="240" height="132" fill="#fff" stroke="${INK}" stroke-width="5"/><rect x="-120" y="-66" width="60" height="132" fill="${RED}" stroke="${INK}" stroke-width="5"/><rect x="60" y="-66" width="60" height="132" fill="${RED}" stroke="${INK}" stroke-width="5"/>${leaf(.8)}<path d="M-120,-66 V140" stroke="${INK}" stroke-width="7"/>`;
const piggy = () => `<ellipse cx="0" cy="0" rx="110" ry="80" fill="#f7b9c9" stroke="${INK}" stroke-width="5"/><path d="M-60,-60 L-40,-110 L-20,-70" fill="#f7b9c9" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><ellipse cx="-108" cy="10" rx="26" ry="30" fill="#f49ab2" stroke="${INK}" stroke-width="5"/><circle cx="-114" cy="2" r="4" fill="${INK}"/><circle cx="-102" cy="18" r="4" fill="${INK}"/><circle cx="-60" cy="-20" r="7" fill="${INK}"/><rect x="-20" y="-80" width="50" height="10" rx="5" fill="${INK}"/><path d="M-60,70 V100 M-20,76 V104 M30,76 V104 M70,66 V96" stroke="${INK}" stroke-width="14" stroke-linecap="round"/><path d="M108,-10 q24,-10 14,-30 q-10,-14 -18,0" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`;
const bubble = (w, h, body) => `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="#fff" stroke="${INK}" stroke-width="5"/><circle cx="${-w * .18}" cy="${h / 2 + 34}" r="16" fill="#fff" stroke="${INK}" stroke-width="5"/><circle cx="${-w * .24}" cy="${h / 2 + 72}" r="9" fill="#fff" stroke="${INK}" stroke-width="4.5"/>${body}`;
const stamp = (s, c = RED, size = 54, rot = -8) => `<g transform="rotate(${rot})"><rect x="${-s.length * size * .28 - 24}" y="${-size * .85}" width="${s.length * size * .56 + 48}" height="${size * 1.25}" rx="10" fill="#fff" stroke="${c}" stroke-width="7"/>${txt(0, size * .2, s, size, { fill: c })}</g>`;
const pill = (s, bg, fg = '#fff', size = 40, padX = 30) => `<rect x="${-s.length * size * .26 - padX}" y="${-size * .82}" width="${s.length * size * .52 + padX * 2}" height="${size * 1.35}" rx="${size * .67}" fill="${bg}" stroke="${INK}" stroke-width="4.5"/>${txt(0, size * .22, s, size, { fill: fg })}`;
const doc = (title, w = 220, h = 270) => `<g transform="rotate(4)"><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="6" fill="#fff" stroke="${INK}" stroke-width="5"/>${txt(0, -h / 2 + 44, title, 34)}<path d="M${-w / 2 + 24},${-h / 2 + 70} H${w / 2 - 24} M${-w / 2 + 24},${-h / 2 + 100} H${w / 2 - 50} M${-w / 2 + 24},${-h / 2 + 130} H${w / 2 - 24}" stroke="#8a8a8a" stroke-width="4"/>${txt(-w / 2 + 24, -h / 2 + 182, 'Gross', 28, { anchor: 'start', w: 400 })}${txt(w / 2 - 24, -h / 2 + 182, '$$$', 28, { anchor: 'end' })}${txt(-w / 2 + 24, -h / 2 + 222, 'Tax', 28, { anchor: 'start', fill: RED })}${txt(w / 2 - 24, -h / 2 + 222, '−$?', 28, { anchor: 'end', fill: RED })}</g>`;
const bell = () => `<path d="M-40,30 Q-40,-50 0,-52 Q40,-50 40,30 L52,44 H-52 Z" fill="#f2c94c" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><circle cy="56" r="11" fill="#f2c94c" stroke="${INK}" stroke-width="5"/><path d="M-70,-30 q-14,24 0,52 M70,-30 q14,24 0,52" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
const sparks = (r = 120) => Array.from({ length: 8 }, (_, i) => { const a = i * Math.PI / 4, c = Math.cos(a), s = Math.sin(a); return line(c * r, s * r, c * (r + 30), s * (r + 30), INK, 5); }).join('');

// ---------- character ----------
const L1 = 88, L2 = 84, SHX = 46, SHY = -372;
const LF = [-66, -212, 'fist'], RF = [66, -212, 'fist'];
const HP = { // hand targets [x, y, handShape], character space (feet = 0,0)
  idle: { R: RF, L: LF },
  point: { R: [205, -450, 'point'], L: LF },
  pointUp: { R: [95, -540, 'point'], L: LF },
  pointL: { R: RF, L: [-205, -450, 'point'] },
  shrug: { R: [125, -430, 'open'], L: [-125, -430, 'open'] },
  think: { R: [22, -402, 'fist'], L: [-30, -300, 'fist'] },
  present: { R: [175, -330, 'open'], L: [-175, -330, 'open'] },
  thumbs: { R: [120, -440, 'thumb'], L: LF },
  hold: { R: RF, L: [-110, -250, 'fist'] },
  hips: { R: [64, -250, 'fist'], L: [-64, -250, 'fist'] },
  cheer: { R: [125, -545, 'open'], L: [-125, -545, 'open'] },
  facepalm: { R: [8, -482, 'open'], L: LF },
  scratch: { R: [45, -550, 'fist'], L: LF },
  cheeks: { R: [86, -442, 'open'], L: [-86, -442, 'open'] },
  reach: { R: [80, -565, 'open'], L: [-80, -565, 'open'] },
  wave: { R: [150, -525, 'open'], L: LF },
  wag: { R: [120, -485, 'point'], L: [-64, -250, 'fist'] },
  guns: { R: [178, -390, 'point'], L: [-178, -390, 'point'] },
  clap: { R: [16, -330, 'open'], L: [-16, -330, 'open'] },
  shh: { R: [10, -436, 'point'], L: LF },
};
const LOOK = { c: [0, 0], r: [7, 0], l: [-7, 0], u: [0, -6], ur: [6, -5], ul: [-6, -5], d: [0, 5], dl: [-6, 4], dr: [6, 4] };
let charId = 0;
const character = (o) => `<g class="char" id="c${charId++}" data-x="${o.x}" data-y="${o.y}" data-s="${o.s || 1}" data-flip="${o.flip ? -1 : 1}"
  data-pose='${JSON.stringify(o.pose)}' data-expr='${JSON.stringify(o.expr)}' data-act='${JSON.stringify(o.act || [])}' data-look='${JSON.stringify(o.look || [[0, 'c']])}' data-tie="${o.tie || BLUE}" data-outfit="${o.outfit || 'shirt'}" data-acc="${o.acc || ''}" data-from="${o.from ?? -1}"></g>`;

function ik(sx, sy, hx, hy, side) {
  let dx = hx - sx, dy = hy - sy, d = Math.hypot(dx, dy); const mx = L1 + L2 - 1;
  if (d > mx) { dx *= mx / d; dy *= mx / d; hx = sx + dx; hy = sy + dy; d = mx; }
  d = Math.max(d, 24);
  const a = Math.atan2(dy, dx), b = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
  const e1 = [sx + L1 * Math.cos(a + b), sy + L1 * Math.sin(a + b)], e2 = [sx + L1 * Math.cos(a - b), sy + L1 * Math.sin(a - b)];
  const e = side * e1[0] + .35 * e1[1] > side * e2[0] + .35 * e2[1] ? e1 : e2;
  return { ex: e[0], ey: e[1], hx, hy };
}
function hand(x, y, ux, uy, shape, white) {
  const fing = (x2, y2, w) => white ? `<path d="M${x},${y} L${x2},${y2}" stroke="${NV}" stroke-width="${w * 1.6 + 9}" stroke-linecap="round"/><path d="M${x},${y} L${x2},${y2}" stroke="#fff" stroke-width="${w * 1.6}" stroke-linecap="round"/>` : `<path d="M${x},${y} L${x2},${y2}" stroke="${INK}" stroke-width="${w}" stroke-linecap="round"/>`;
  const r = (a, l) => { const c = Math.cos(a), s = Math.sin(a); return [x + (ux * c - uy * s) * l, y + (ux * s + uy * c) * l]; };
  let h = '';
  if (shape === 'point') { const [fx, fy] = r(0, white ? 36 : 26); h += fing(fx, fy, 7); }
  if (shape === 'thumb') h += fing(x, y - (white ? 34 : 28), white ? 7 : 10);
  if (shape === 'open') for (const a of [-.7, 0, .7]) { const [fx, fy] = r(a, 20); h += fing(fx, fy, 6); }
  return h + (white ? `<circle cx="${x}" cy="${y}" r="${shape === 'open' ? 18 : 20}" fill="#fff" stroke="${NV}" stroke-width="5.5"/><path d="M${x - 8},${y + 6} q6,6 14,2" stroke="${NV}" stroke-width="3" fill="none" stroke-linecap="round"/>` : `<circle cx="${x}" cy="${y}" r="${shape === 'open' ? 11 : 13}" fill="${INK}"/>`);
}
const star5 = (r, fill = '#ffd43b') => { let p = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; p += (i ? 'L' : 'M') + (Math.cos(a) * rr).toFixed(1) + ',' + (Math.sin(a) * rr).toFixed(1); } return `<path d="${p}Z" fill="${fill}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`; };
const spark4 = (r) => `<path d="M0,${-r} Q2,-2 ${r},0 Q2,2 0,${r} Q-2,2 ${-r},0 Q-2,-2 0,${-r}Z" fill="#ffd43b" stroke="${INK}" stroke-width="2.5"/>`;

function face(ex, t, amp, lk, blink) {
  const [lx, ly] = lk; let eyes = '', brows = '', mouth = '', emo = '', tint = '#fff';
  const E = (x) => `<ellipse cx="${x + lx}" cy="${-10 + ly}" rx="8.5" ry="${13 * blink}" fill="${INK}"/>` + (blink > .5 ? `<circle cx="${x + lx + 3}" cy="${-15 + ly}" r="3.4" fill="#fff"/>` : '');
  const arcUp = (x) => `<path d="M${x - 11},${-6} Q${x},${-22} ${x + 11},${-6}" stroke="${INK}" stroke-width="5.5" fill="none" stroke-linecap="round"/>`;
  const bw = (l, r) => `<path d="${l} ${r}" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  const my = 36, talk = amp > .1;
  const grin = (w, k = 1) => { const o = 10 + amp * 18 * k; return `<path d="M${-w},${my - 6} Q0,${my - 6 + o * 2.1} ${w},${my - 6} Z" fill="#3a1f1f" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/><path d="M${-w * .45},${my - 6 + o * 1.25} Q0,${my - 6 + o * .7} ${w * .45},${my - 6 + o * 1.25} Q0,${my - 6 + o * 1.6} ${-w * .45},${my - 6 + o * 1.25}Z" fill="#ff8a9a"/><path d="M${-w + 5},${my - 5} Q0,${my} ${w - 5},${my - 5}" stroke="#fff" stroke-width="4.5" fill="none"/>`; };

const heart = (r = 1) => `<g transform="scale(${r})"><path d="M0,30 L-8,10 L6,-6 L-4,-26 C-20,-50 -70,-40 -66,-6 C-62,24 -20,50 0,70 Z" fill="${RED}" stroke="${INK}" stroke-width="4" transform="translate(-12,0) rotate(-10)"/><path d="M0,30 L-8,10 L6,-6 L-4,-26 C14,-50 70,-40 66,-6 C62,24 20,50 0,70 Z" fill="${RED}" stroke="${INK}" stroke-width="4" transform="translate(12,0) rotate(10)"/></g>`;
const stub = (w = 300, h = 360) => `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="8" fill="#fff" stroke="${INK}" stroke-width="5"/><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="56" rx="8" fill="${BLUE}" stroke="${INK}" stroke-width="5"/>${txt(0, -h / 2 + 40, 'PAYCHEQUE', 34, { fill: '#fff' })}
  ${['Gross pay', 'Fed. tax', 'Prov. tax', 'CPP', 'EI', 'NET'].map((l, i) => `${txt(-w / 2 + 22, -h / 2 + 100 + i * 44, l, 28, { anchor: 'start', w: i === 0 || i === 5 ? 700 : 400, fill: i === 5 ? GREEN : INK })}<path d="M${w / 2 - 90},${-h / 2 + 92 + i * 44} H${w / 2 - 24}" stroke="#bbb" stroke-width="6" stroke-linecap="round"/>`).join('')}`;
const shield = () => `<path d="M0,-80 L66,-56 Q66,40 0,84 Q-66,40 -66,-56 Z" fill="${BLUE}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>${check(30, '#fff')}`;
const umbrella = () => `<path d="M-150,0 Q-150,-120 0,-125 Q150,-120 150,0 Q125,-22 100,0 Q75,-22 50,0 Q25,-22 0,0 Q-25,-22 -50,0 Q-75,-22 -100,0 Q-125,-22 -150,0Z" fill="${RED}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><path d="M-50,0 Q-30,-110 0,-125 Q30,-110 50,0" fill="none" stroke="${INK}" stroke-width="3"/><path d="M0,-125 V110 q0,22 -20,22 q-18,0 -18,-18" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
const rain = (x0, x1, y0, y1) => { let s = ''; for (let i = 0; i < 22; i++) { const x = x0 + (i * 53 % (x1 - x0)), y = y0 + (i * 97 % (y1 - y0)); s += `<path d="M${x},${y} l-6,22" stroke="#7cb8e8" stroke-width="4" stroke-linecap="round"/>`; } return s; };
const magnifier = () => `<circle r="60" fill="#dff1ff" fill-opacity=".6" stroke="${INK}" stroke-width="7"/><path d="M42,42 L100,100" stroke="${INK}" stroke-width="16" stroke-linecap="round"/><path d="M-30,-30 q15,-12 30,-10" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/>`;
const bank = () => `<path d="M-90,-40 L0,-95 L90,-40 Z" fill="#e9e9e9" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>${txt(0, -50, '$', 34, { fill: DG })}${[-60, -20, 20, 60].map(x => `<rect x="${x - 9}" y="-36" width="18" height="70" fill="#fff" stroke="${INK}" stroke-width="4"/>`).join('')}<rect x="-100" y="34" width="200" height="18" fill="#e9e9e9" stroke="${INK}" stroke-width="5"/>`;
const tag = (s, c) => `<rect x="-44" y="-30" width="88" height="60" rx="10" fill="${c}" stroke="${INK}" stroke-width="4"/>${txt(0, 12, s, 32, { fill: '#fff' })}`;
const row = (tin, i, label, amt, col = INK, y0 = 360) => A(tin, 'up', `${txt(0, 0, label, 40, { anchor: 'start', fill: col === RED ? INK : col })}${txt(470, 0, amt, 44, { anchor: 'end', fill: col })}`, { x: 120, y: y0 + i * 84 });
const months = (tin) => 'JFMAMJJASOND'.split('').map((m, i) => { const h = i >= 10 ? 210 : i >= 9 ? 170 : 130; return A(tin + i * .07, 'grow', `<rect x="${-18}" y="${-h}" width="36" height="${h}" fill="${i >= 10 ? 'url(#hatchB)' : 'url(#hatchG)'}" stroke="${INK}" stroke-width="3.5"/>`, { x: 105 + i * 47, y: 860, dur: .6 }) + txt(105 + i * 47, 900, m, 28); }).join('');
// speech bubble with a tail pointing down toward the speaker (tail: -1 left, 1 right)
const say = (w, h, body, tail = -1) => `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="26" fill="#fff" stroke="${INK}" stroke-width="5"/><path d="M${tail * w * .18 - 22},${h / 2 - 3} L${tail * w * .34},${h / 2 + 46} L${tail * w * .18 + 22},${h / 2 - 3}" fill="#fff" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><rect x="${tail * w * .18 - 20}" y="${h / 2 - 8}" width="40" height="10" fill="#fff"/>${body}`;
const house = () => `<path d="M-120,0 V-130 L0,-215 L120,-130 V0 Z" fill="#fff4dc" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><path d="M-140,-120 L0,-235 L140,-120" fill="none" stroke="${RED}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><rect x="-28" y="-80" width="56" height="80" fill="${BLUE}" stroke="${INK}" stroke-width="4"/><rect x="50" y="-110" width="44" height="40" fill="#cfe8ff" stroke="${INK}" stroke-width="4"/><rect x="-94" y="-110" width="44" height="40" fill="#cfe8ff" stroke="${INK}" stroke-width="4"/>`;
const shareIcon = () => `<circle r="60" fill="${GREEN}" stroke="${INK}" stroke-width="5"/><path d="M-22,10 L18,-14 M-22,10 L18,30" stroke="#fff" stroke-width="7"/><circle cx="-22" cy="10" r="11" fill="#fff"/><circle cx="20" cy="-16" r="11" fill="#fff"/><circle cx="20" cy="32" r="11" fill="#fff"/>`;
const nameTag = (s, c = BLUE) => `<rect x="-70" y="-24" width="140" height="48" rx="24" fill="${c}" stroke="${INK}" stroke-width="4"/>${txt(0, 12, s, 34, { fill: '#fff' })}`;

</script>
<script src="scenes.js"></script>
<script>
// ---------- build ----------
const root = document.getElementById('root');
root.innerHTML = SC.map((c, i) => `<g class="scene" id="s${i}" data-s="${c.s}" data-e="${c.e}" style="display:none"><g class="mbw"><g class="cam">${c.body}</g></g></g>`).join('');
const scenes = [...document.querySelectorAll('.scene')].map(el => ({ el, s: +el.dataset.s, e: +el.dataset.e, mbw: el.firstChild, cam: el.firstChild.firstChild, ans: [...el.querySelectorAll('.an')], chars: [...el.querySelectorAll('.char')] }));
for (const el of document.querySelectorAll('.an')) {
  if (el.dataset.a === 'draw') el.querySelectorAll('[pathLength]').forEach(p => p.setAttribute('stroke-dasharray', '1 1'));
  if (el.dataset.a === 'count') { const t = el.querySelector('text[data-n]'); el._t = t; }
}

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const eOut = p => 1 - Math.pow(1 - p, 3);
const eBack = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const eBounce = p => { const n = 7.5625, d = 2.75; if (p < 1 / d) return n * p * p; if (p < 2 / d) return n * (p -= 1.5 / d) * p + .75; if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + .9375; return n * (p -= 2.625 / d) * p + .984375; };
const DUR = { mark: .4, pop: .45, up: .45, fade: .4, draw: .55, drop: .75, grow: 1.2, fly: 2, count: 1.4, stamp: .32 };
const fmt = n => n.toLocaleString('en-US');

function animEl(el, t) {
  const a = el.dataset.a, tin = +el.dataset.in, dur = +(el.dataset.dur || DUR[a]);
  const p = clamp((t - tin) / dur);
  const st = el.style;
  if (t < tin) { st.opacity = 0; return; }
  st.opacity = 1;
  switch (a) {
    case 'pop': st.transform = `scale(${eBack(p)})`; st.opacity = clamp(p * 4); break;
    case 'up': st.transform = `translateY(${(1 - eOut(p)) * 40}px)`; st.opacity = clamp(p * 2); break;
    case 'fade': st.opacity = p; break;
    case 'rain': st.transform = `translateY(${((t - tin) * 520) % 97}px)`; st.opacity = clamp((t - tin) * 3) * .8; break;
    case 'slide': { const q = (t - tin) / dur; st.transform = `translate(${Math.sin(q * 6) * +el.dataset.dx}px,${clamp(q) * +el.dataset.dy}px) scale(${eBack(clamp((t - tin) / .4))})`; break; }
    case 'mark': st.transformOrigin = 'left'; st.transform = `scaleX(${Math.max(.001, eOut(p))})`; break;
    case 'stamp': st.transform = `scale(${2.2 - 1.2 * eOut(p)})`; st.opacity = clamp(p * 3); break;
    case 'drop': st.transform = `translateY(${-(1 - eBounce(p)) * 500}px)`; break;
    case 'grow': st.transformOrigin = 'bottom'; st.transform = `scaleY(${Math.max(.001, eOut(p))})`; break;
    case 'fly': { const q = clamp((t - tin - .3) / dur); const pp = clamp((t - tin) / .3);
      st.transform = `translate(${+el.dataset.dx * eOut(q) * 1.6}px,${+el.dataset.dy * eOut(q) * 1.6}px) rotate(${q * 50}deg) scale(${eBack(pp)})`; st.opacity = 1 - clamp((q - .55) / .45); break; }
    case 'count': { st.transform = `scale(${eBack(clamp(p * 3))})`; const n = +el._t.dataset.n; el._t.textContent = (el._t.dataset.pre || '') + fmt(p >= 1 ? n : Math.round(n * eOut(p) / (n >= 1000 ? 10 : 1)) * (n >= 1000 ? 10 : 1)); break; }
    case 'draw': el.querySelectorAll(':scope > g > [pathLength]').forEach(pth => pth.setAttribute('stroke-dashoffset', 1 - eOut(p))); break;
  }
}

function lookup(tl, t) { let cur = tl[0], prev = tl[0]; for (const k of tl) { if (t >= k[0]) { prev = cur; cur = k; } } return { cur, prev }; }
const TR = 0.3, VEND = CFG.voiceEnd, LOGO_T = CFG.endScene + .08, END_S = CFG.endScene;
const STAMPS = [...document.querySelectorAll('.an[data-a="stamp"]')].map(e => +e.dataset.in);

// ---------- premium backgrounds (CFG.bg) ----------
const BG = {
  plain: () => '',
  dots: () => `<defs><linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfaf6"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <pattern id="bgDots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1.9" fill="#c9d2de"/></pattern></defs>
    <rect width="720" height="1280" fill="url(#bgG)"/><rect class="bgDrift" x="-60" y="-60" width="840" height="1400" fill="url(#bgDots)" opacity=".85"/>`,
  grid: () => `<defs><linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfcf8"/><stop offset="1" stop-color="#f3f6fa"/></linearGradient>
    <pattern id="bgMinor" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32,0 H0 V32" fill="none" stroke="#e3e9f1" stroke-width="1.2"/></pattern>
    <pattern id="bgMajor" width="160" height="160" patternUnits="userSpaceOnUse"><rect width="160" height="160" fill="url(#bgMinor)"/><path d="M160,0 H0 V160" fill="none" stroke="#d3ddea" stroke-width="2"/></pattern></defs>
    <rect width="720" height="1280" fill="url(#bgG)"/><rect class="bgDrift" x="-160" y="-160" width="1040" height="1600" fill="url(#bgMajor)"/>`,
  aurora: () => `<defs><linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf6"/><stop offset="1" stop-color="#f1f4f9"/></linearGradient>
    <filter id="bgBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <pattern id="bgDots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.6" fill="#cfd7e2"/></pattern></defs>
    <rect width="720" height="1280" fill="url(#bgG)"/>
    <g filter="url(#bgBlur)" opacity=".55"><circle class="blob" data-k="0" cx="120" cy="230" r="210" fill="#bcd8f5"/><circle class="blob" data-k="1" cx="640" cy="620" r="230" fill="#c9ecd2"/><circle class="blob" data-k="2" cx="200" cy="1120" r="220" fill="#ffe2b8"/></g>
    <rect class="bgDrift" x="-60" y="-60" width="840" height="1400" fill="url(#bgDots)" opacity=".7"/>`,
};
function bgInit() { document.getElementById('bg').innerHTML = (BG[CFG.bg || 'dots'] || BG.dots)(); }
function bgRender(t) {
  for (const el of document.querySelectorAll('#bg .bgDrift')) el.setAttribute('transform', `translate(${(t * 4) % 30},${(t * 6) % 30})`);
  for (const el of document.querySelectorAll('#bg .blob')) { const k = +el.dataset.k; el.setAttribute('transform', `translate(${Math.sin(t * .15 + k * 2) * 60},${Math.cos(t * .12 + k) * 70})`); }
}

window.render = function (t) {
  if (!window._bgDone) { bgInit(); if (CFG.logo) document.querySelectorAll('#wm image, #endlogo image').forEach(i => i.setAttribute('href', CFG.logo)); window._bgDone = 1; }
  bgRender(t);
  const amp = AMP[Math.min(AMP.length - 1, Math.floor(t * 24))] || 0;
  const filt = 'url(#r' + (Math.floor(t * 8) % 3) + ')';
  let shx = 0, shy = 0, punch = 0;
  for (const st of STAMPS) { const d = t - st - .12; if (d > 0 && d < .35) { const k = Math.exp(-d * 14); shx += Math.sin(d * 90) * 9 * k; shy += Math.cos(d * 75) * 7 * k; punch += .05 * k; } }
  document.getElementById('root').setAttribute('transform', `translate(${shx},${shy})`);
  document.getElementById('prog').setAttribute('width', 720 * clamp(t / VEND));
  const LT = LOGO_T, el = document.getElementById('endlogo');
  const BRAND = CFG.brand !== false;   // brand:false = no logo watermark, no logo ending
  document.getElementById('wm').style.display = !BRAND || !CFG.watermark || t >= END_S ? 'none' : '';
  el.style.display = BRAND && t >= LT ? '' : 'none';
  if (t >= LT) { const p = clamp((t - LT) / .55); el.setAttribute('transform', `translate(360,${300 + Math.sin(t * 2.4) * 4}) scale(${eBack(p)}) rotate(${(1 - eOut(p)) * -25})`); }
  scenes.forEach((sc, i) => {
    const on = t >= sc.s - 0.001 && t < sc.e + (i < scenes.length - 1 ? TR : 0);
    sc.el.style.display = on ? '' : 'none';
    if (!on) return;
    const lt = t - sc.s;
    let tx = 0, blur = false;
    if (i > 0 && lt < TR) { const p = lt / TR; tx = (1 - eOut(p)) * 760; blur = p < .8; }
    if (t >= sc.e) { const p = (t - sc.e) / TR; tx = -Math.pow(p, 2) * 760; blur = true; }
    sc.el.style.transform = `translateX(${tx}px)`;
    sc.mbw.setAttribute('filter', blur ? 'url(#mb)' : '');
    sc.cam.style.transform = `scale(${1 + .035 * clamp(lt / Math.min(10, sc.e - sc.s)) + punch})`;
    sc.el.setAttribute('filter', filt);
    for (const el of sc.ans) animEl(el, t);
    for (const c of sc.chars) drawChar(c, t, amp);
  });
};
window.CFG_OUT = () => ({ ...CFG, frames: Math.ceil((CFG.voiceEnd + CFG.tail) * 24) });
window.qa = qaRun;
window.cues = () => [...document.querySelectorAll('.an')].map(e => ({ t: +e.dataset.in, a: e.dataset.a, sfx: e.dataset.sfx || '', dur: +(e.dataset.dur || DUR[e.dataset.a]), money: !!e.querySelector('text[data-pre]') })).concat(scenes.slice(1).map(sc => ({ t: sc.s, a: 'scene', sfx: '', dur: TR })))
  .concat([...document.querySelectorAll('.char')].flatMap(c => { const sc = scenes.find(s => s.el.contains(c));
    const ok = t => t >= sc.s && t < sc.e;
    return JSON.parse(c.dataset.act).filter(a => ok(a[0])).map(([t, n, d]) => ({ t, a: 'act', sfx: n, dur: d || .5 }))
      .concat(JSON.parse(c.dataset.expr).filter(e => ok(e[0]) && e[0] > sc.s + .05).map(([t, n]) => ({ t, a: 'expr', sfx: n, dur: 0 }))); }));
render(0);

// ---------- automatic QA ----------
function qaRun() {
  const issues = [], K = 720 / document.getElementById('v').getBoundingClientRect().width;
  const box = el => { const r = el.getBoundingClientRect(); return { x0: r.left * K, y0: r.top * K, x1: r.right * K, y1: r.bottom * K }; };
  const inter = (a, b) => Math.max(0, Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0)) * Math.max(0, Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0));
  const area = a => (a.x1 - a.x0) * (a.y1 - a.y0);
  scenes.forEach((sc, i) => {
    const ends = Math.min(sc.e, CFG.voiceEnd + CFG.tail) - .05;
    for (const t of [ends]) {
      render(t);
      const texts = [...sc.el.querySelectorAll('text')].filter(x => x.textContent.trim() && !x.closest('.char') && x.closest('.an') && +getComputedStyle(x.closest('.an')).opacity > .5).map(x => { const b = box(x), h = b.y1 - b.y0; return { s: x.textContent.trim(), b: { x0: b.x0 + 2, x1: b.x1 - 2, y0: b.y0 + h * .28, y1: b.y1 - h * .2 }, raw: b, top: x.closest('.an') }; });
      const chars = [...sc.el.querySelectorAll('.char')].filter(c => c.innerHTML).map(c => { const b = box(c); return { b: { x0: b.x0 + 8, y0: b.y0 + 30, x1: b.x1 - 8, y1: b.y1 - 10 }, s: +c.dataset.s }; });
      for (const tx of texts) {
        if (tx.raw.x0 < 4 || tx.raw.x1 > 716) issues.push(`scene ${i + 1} @${t.toFixed(1)}s: text "${tx.s}" goes off-screen`);
        for (const c of chars) if (inter(tx.b, c.b) > .04 * area(tx.b)) issues.push(`scene ${i + 1} @${t.toFixed(1)}s: text "${tx.s}" overlaps the character`);
      }
      for (let a = 0; a < texts.length; a++) for (let b = a + 1; b < texts.length; b++) {
        if (texts[a].top === texts[b].top || texts[a].top.contains(texts[b].top) || texts[b].top.contains(texts[a].top)) continue;
        if (inter(texts[a].b, texts[b].b) > .15 * Math.min(area(texts[a].b), area(texts[b].b))) issues.push(`scene ${i + 1} @${t.toFixed(1)}s: "${texts[a].s}" overlaps "${texts[b].s}"`);
      }
      for (const c of chars) if (c.s < .36) issues.push(`scene ${i + 1}: character scale ${c.s} is too small (min .36)`);
    }
    const exprs = [...sc.el.querySelectorAll('.char')].flatMap(c => JSON.parse(c.dataset.expr));
    if (sc.e - sc.s > 6 && exprs.length < 2) issues.push(`scene ${i + 1}: ${(sc.e - sc.s).toFixed(1)}s long but the character has only one expression`);
  });
  for (const c of CFG.checks || []) { const v = Function(`return (${c.expr})`)(); if (Math.abs(v - c.expect) > (c.tol ?? .5)) issues.push(`${c.warn ? '(warning) ' : ''}math: ${c.label}: ${c.expr} = ${v}, but video says ${c.expect}`); }
  [...document.querySelectorAll('.an[data-a="count"] text[data-n]')].forEach(tx => { const el = tx.closest('.an'); render(+el.dataset.in + 5); const want = (tx.dataset.pre || '') + (+tx.dataset.n).toLocaleString('en-US'); if (tx.textContent !== want) issues.push(`counter ends on "${tx.textContent}" instead of "${want}"`); });
  if (CFG.whoosh.length > 7) issues.push(`too many whooshes (${CFG.whoosh.length}); keep 4–6 major sections only`);
  return issues;
}
